<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#a65488"/>
      <stop offset=".55" stop-color="#5a2b48"/>
      <stop offset="1" stop-color="#2a1424"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffcf4a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffcf4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a55"/>
      <stop offset="1" stop-color="#7d4626"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2e1a"/>
      <stop offset="1" stop-color="#8a4f2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset=".5" stop-color="#ffcf4a"/>
      <stop offset="1" stop-color="#e09a1c"/>
    </linearGradient>
    <radialGradient id="coin" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset=".45" stop-color="#ffcf4a"/>
      <stop offset="1" stop-color="#c98612"/>
    </radialGradient>
    <g id="star"><path d="M0 -1 C .12 -.12 .12 -.12 1 0 C .12 .12 .12 .12 0 1 C -.12 .12 -.12 .12 -1 0 C -.12 -.12 -.12 -.12 0 -1Z"/></g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0 34)">
  <!-- light rays -->
  <g opacity=".22" fill="#ffe08a" transform="translate(256 236)">
    <path d="M0 0 L-40 -260 L40 -260Z"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(35)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(-35)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(70)"/>
    <path d="M0 0 L-40 -260 L40 -260Z" transform="rotate(-70)"/>
  </g>
  <circle cx="256" cy="232" r="170" fill="url(#glow)"/>

  <!-- open lid (inside face) -->
  <path d="M130 250 L150 148 Q256 118 362 148 L382 250Z" fill="url(#lid)" stroke="#2e1810" stroke-width="12" stroke-linejoin="round"/>
  <path d="M150 148 Q256 118 362 148" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <path d="M150 148 Q256 118 362 148" fill="none" stroke="#2e1810" stroke-width="4" stroke-linecap="round" opacity=".5" transform="translate(0 9)"/>

  <!-- coin heap -->
  <g stroke="#8a5306" stroke-width="6">
    <ellipse cx="170" cy="246" rx="34" ry="20" fill="url(#coin)"/>
    <ellipse cx="342" cy="246" rx="34" ry="20" fill="url(#coin)"/>
    <ellipse cx="214" cy="232" rx="36" ry="21" fill="url(#coin)"/>
    <ellipse cx="300" cy="232" rx="36" ry="21" fill="url(#coin)"/>
    <ellipse cx="256" cy="220" rx="38" ry="22" fill="url(#coin)"/>
    <ellipse cx="232" cy="200" rx="32" ry="19" fill="url(#coin)"/>
    <ellipse cx="284" cy="196" rx="30" ry="18" fill="url(#coin)"/>
  </g>
  <!-- gems -->
  <g stroke="#2e1810" stroke-width="6" stroke-linejoin="round">
    <path d="M178 214 l18 -16 h22 l18 16 l-29 30z" fill="#ff7fc0"/>
    <path d="M196 198 l11 16 l11 -16" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
    <path d="M300 216 l14 -14 h18 l14 14 l-23 26z" fill="#5cd6f5"/>
  </g>
  <!-- standing coin -->
  <g transform="translate(256 168) rotate(-12)">
    <circle r="44" fill="url(#coin)" stroke="#8a5306" stroke-width="7"/>
    <circle r="27" fill="none" stroke="#d88d14" stroke-width="7"/>
    <path d="M-14 -30 A 34 34 0 0 1 22 -26" fill="none" stroke="#fffbe0" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- chest body -->
  <rect x="118" y="252" width="276" height="160" rx="24" fill="url(#wood)" stroke="#2e1810" stroke-width="12"/>
  <path d="M124 300 H388" stroke="#2e1810" stroke-width="6" opacity=".35"/>
  <path d="M124 350 H388" stroke="#2e1810" stroke-width="6" opacity=".35"/>
  <!-- gold bands -->
  <rect x="150" y="252" width="34" height="160" fill="url(#gold)" stroke="#2e1810" stroke-width="8"/>
  <rect x="328" y="252" width="34" height="160" fill="url(#gold)" stroke="#2e1810" stroke-width="8"/>
  <rect x="118" y="252" width="276" height="24" rx="10" fill="url(#gold)" stroke="#2e1810" stroke-width="8"/>
  <!-- lock -->
  <path d="M224 284 H288 V334 Q288 354 256 362 Q224 354 224 334Z" fill="url(#gold)" stroke="#2e1810" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="256" cy="312" r="9" fill="#2e1810"/>
  <path d="M252 316 H260 L262 336 H250Z" fill="#2e1810"/>
  <!-- top shine on body -->
  <rect x="134" y="286" width="10" height="100" rx="5" fill="#fff" opacity=".18"/>

  </g>
  <!-- sparkles -->
  <g fill="#fffbe6">
    <use href="#star" transform="translate(116 132) scale(22)"/>
    <use href="#star" transform="translate(398 112) scale(28)"/>
    <use href="#star" transform="translate(410 222) scale(14)"/>
    <use href="#star" transform="translate(96 228) scale(12)"/>
    <use href="#star" transform="translate(322 92) scale(10)"/>
  </g>
</svg>
